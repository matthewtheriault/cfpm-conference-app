name: Send scheduled notifications

# Manual backup only. Scheduled sends are handled every minute by the
# sendScheduledNotifications Cloud Function (functions/index.js); GitHub's
# cron was throttled to runs hours apart, so it no longer runs on a schedule.
# Use "Run workflow" on the Actions tab if the Cloud Function is ever down.
on:
  workflow_dispatch: {}

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/sendScheduledNotifications.js
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
